name: build-cn10k-vpp

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-cn10k-vpp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-cn10k-build:
    name: ubuntu-cn10k-arm64
    runs-on: ubuntu-24.04-arm
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Generate cache keys
        id: get_ref_keys
        run: |
          echo "ccache=ccache-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"


      - name: Restore ccache cache
        uses: actions/cache@v4.2.3
        with:
          path: ~/.ccache
          key: ${{ steps.get_ref_keys.outputs.ccache }}-${{ github.ref }}
          restore-keys: |
            ${{ steps.get_ref_keys.outputs.ccache }}-refs/heads/main

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -y -q
          sudo apt-get install -y -q ccache jq lsb-release software-properties-common wget
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -y -q
          sudo APT_ARGS='-y -q' make install-deps

      - name: Install latest cn10k target package (devel)
        run: |
          set -euxo pipefail
          DISTRO="ubuntu-$(lsb_release -rs)"
          BASE="$(cut -d. -f1,2 < VERSION)"
          GH_REPO="MarvellEmbeddedProcessors/dao"
          BEST="$(curl -fsSL "https://api.github.com/repos/${GH_REPO}/releases?per_page=100" | jq -r '.[].tag_name' | grep -E "^oct-ep-target-cn10k-${BASE}\.[0-9]+-${DISTRO}-devel$" | sort -V | tail -n1)"

          if [ -z "${BEST}" ]; then
            echo "No matching oct-ep-target-cn10k devel release found for base ${BASE} and ${DISTRO}"
            exit 1
          fi

          OCT_PKG_VERSION="$(echo "${BEST}" | cut -d- -f5)"
          PKG_FILE="oct-ep-target-cn10k-devel_${OCT_PKG_VERSION}_arm64.deb"
          wget -q "https://github.com/MarvellEmbeddedProcessors/dao/releases/download/${BEST}/${PKG_FILE}"
          sudo apt-get install -y "./${PKG_FILE}"

      - name: Build VPP for cn10k
        run: |
          set -euxo pipefail
          ccache -p
          make build-release VPP_PLATFORM=octeon10

      - name: Print ccache stats
        if: always()
        run: ccache -s
